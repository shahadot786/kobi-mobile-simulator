name: CI

on:
  pull_request:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & Lint
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftFormat & SwiftLint
        run: brew install swiftformat swiftlint

      - name: Check formatting (swiftformat --lint)
        run: swiftformat --lint .

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  build:
    name: Build
    runs-on: macos-26
    # TODO: remove once a GitHub-hosted runner ships Xcode 27 (LastUpgradeCheck in this
    # project's .pbxproj is 2700). No hosted runner can open this project yet — 26.6 below is
    # the newest available today — so this job is non-blocking rather than red on every run.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Build Kobi (My Mac, unsigned)
        run: |
          xcodebuild build \
            -project Kobi.xcodeproj \
            -scheme Kobi \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
